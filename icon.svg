<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Background Gradient -->
    <radialGradient id="appBg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Premium Phone Frame Gradient -->
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Inner Screen Glass Effect -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Premium Text Gradient -->
    <linearGradient id="agbTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Progress Ring Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Premium Glow Filter -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Inner Shadow for Screen -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.5" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Clip Path for Screen Content -->
    <clipPath id="screenClip">
      <rect x="124" y="64" width="264" height="384" rx="32"/>
    </clipPath>
  </defs>

  <!-- Base App Container with Subtle Depth -->
  <rect width="512" height="512" rx="112" fill="url(#appBg)"/>
  
  <!-- Outer Rim Highlight -->
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Phone Frame with Premium Glow -->
  <rect x="116" y="56" width="280" height="400" rx="40" fill="none" stroke="url(#phoneBorder)" stroke-width="6" filter="url(#glowEffect)" opacity="0.9"/>
  <rect x="118" y="58" width="276" height="396" rx="38" fill="none" stroke="url(#phoneBorder)" stroke-width="2" opacity="0.6"/>

  <!-- Phone Screen with Glass Effect -->
  <rect x="124" y="64" width="264" height="384" rx="32" fill="url(#screenGlass)" filter="url(#innerShadow)"/>
  
  <!-- Screen Top Bar -->
  <rect x="124" y="64" width="264" height="48" rx="32" fill="#0f172a" clip-path="url(#screenClip)"/>
  <rect x="124" y="64" width="264" height="32" rx="16" fill="#0f172a" clip-path="url(#screenClip)"/>

  <!-- Dynamic Island / Notch -->
  <rect x="216" y="76" width="80" height="10" rx="5" fill="#0f172a"/>
  <rect x="218" y="77" width="76" height="8" rx="4" fill="#334155" opacity="0.6"/>

  <!-- Screen Content Area -->
  <g clip-path="url(#screenClip)">
    <!-- Subtle Grid Pattern -->
    <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
      <line x1="124" y1="120" x2="388" y2="120"/>
      <line x1="124" y1="160" x2="388" y2="160"/>
      <line x1="124" y1="200" x2="388" y2="200"/>
      <line x1="124" y1="240" x2="388" y2="240"/>
      <line x1="124" y1="280" x2="388" y2="280"/>
      <line x1="124" y1="320" x2="388" y2="320"/>
      <line x1="124" y1="360" x2="388" y2="360"/>
      <line x1="164" y1="64" x2="164" y2="448"/>
      <line x1="204" y1="64" x2="204" y2="448"/>
      <line x1="244" y1="64" x2="244" y2="448"/>
      <line x1="284" y1="64" x2="284" y2="448"/>
      <line x1="324" y1="64" x2="324" y2="448"/>
      <line x1="364" y1="64" x2="364" y2="448"/>
    </g>

    <!-- Decorative Orb behind Progress -->
    <circle cx="256" cy="220" r="60" fill="url(#phoneBorder)" opacity="0.08" filter="url(#glowEffect)"/>
  </g>

  <!-- Progress Ring Track -->
  <circle cx="256" cy="220" r="85" fill="none" stroke="#1e293b" stroke-width="16"/>
  <circle cx="256" cy="220" r="85" fill="none" stroke="#334155" stroke-width="16" stroke-dasharray="2 8" opacity="0.3"/>

  <!-- Animated Progress Ring -->
  <circle cx="256" cy="220" r="85" fill="none" stroke="url(#progressGrad)" stroke-width="16" stroke-dasharray="534" stroke-dashoffset="120" stroke-linecap="round" filter="url(#glowEffect)"/>

  <!-- Progress Percentage Text -->
  <text x="256" y="228" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">78%</text>

  <!-- Center Task Checkmark Icon with Premium Style -->
  <circle cx="256" cy="220" r="45" fill="none" stroke="#10b981" stroke-width="2" opacity="0.2"/>
  <path d="M 228 220 L 248 240 L 284 204" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)"/>
  <path d="M 228 220 L 248 240 L 284 204" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Multi-device Connection Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="160" y1="335" x2="198" y2="335"/>
    <line x1="198" y1="335" x2="236" y2="335"/>
    <line x1="236" y1="335" x2="274" y2="335"/>
    <line x1="274" y1="335" x2="312" y2="335"/>
    <line x1="312" y1="335" x2="350" y2="335"/>
  </g>

  <!-- Multi-device Indicators (6 Nodes) with Glow -->
  <g filter="url(#glowEffect)">
    <circle cx="160" cy="335" r="8" fill="#f59e0b"/>
    <circle cx="198" cy="335" r="8" fill="#10b981"/>
    <circle cx="236" cy="335" r="8" fill="#3b82f6"/>
    <circle cx="274" cy="335" r="8" fill="#a855f7"/>
    <circle cx="312" cy="335" r="8" fill="#ec4899"/>
    <circle cx="350" cy="335" r="8" fill="#ef4444"/>
  </g>
  
  <!-- Inner Dots for Depth -->
  <circle cx="160" cy="335" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="198" cy="335" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="236" cy="335" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="274" cy="335" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="312" cy="335" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="350" cy="335" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Device Label -->
  <text x="256" y="370" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="4">6 DEVICES</text>

  <!-- AGB APP Main Branding Text with Premium Typography -->
  <text x="256" y="412" 
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="38" 
        font-weight="900" 
        letter-spacing="5"
        fill="url(#agbTextGrad)" 
        text-anchor="middle"
        filter="url(#glowEffect)">
    AGB APP
  </text>
  
  <!-- Subtle Text Reflection -->
  <text x="256" y="412" 
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="38" 
        font-weight="900" 
        letter-spacing="5"
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.15">
    AGB APP
  </text>

  <!-- Bottom Accent Line -->
  <line x1="196" y1="432" x2="316" y2="432" stroke="url(#agbTextGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="256" cy="432" r="3" fill="#fbbf24" filter="url(#glowEffect)"/>
</svg>
